project_id = "converter-express"
# Public catalog/fitment and authenticated commands share this endpoint.
# Every authenticated operation is checked with Auth.getUser + getClaims + live session lookup.
[functions.crm-api]
verify_jwt = false

[auth]
site_url = "https://converter-express-portal.vercel.app"
additional_redirect_urls = ["https://converter-express-portal.vercel.app/", "https://converter-express-portal-s1yb.vercel.app/", "https://converter-express-portal.vercel.app/converter-express_1.html", "https://converter-express-portal-s1yb.vercel.app/converter-express_1.html"]
minimum_password_length = 15

[auth.email]
enable_confirmations = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
