project_id = "converter-express"
# Public catalog/fitment and authenticated commands share this endpoint.
# Every authenticated operation is checked with Auth.getUser + getClaims + live session lookup.
[functions.crm-api]
verify_jwt = false

[auth]
site_url = "https://www.converterexpress.net/"
additional_redirect_urls = ["https://www.converterexpress.net/converter-express_1.html", "https://converterexpress.net/", "https://converterexpress.net/converter-express_1.html", "https://www.converterexpress.net/", "https://www.converterexpress.co/", "https://converterexpress.co/", "https://converter-express-portal.vercel.app/", "https://converter-express-portal-s1yb.vercel.app/", "https://converter-express-portal.vercel.app/converter-express_1.html", "https://converter-express-portal-s1yb.vercel.app/converter-express_1.html", "https://converter-express-portal-converterexpress1-9251.vercel.app/", "https://converter-express-portal-converterexpress1-9251.vercel.app/**", "https://converter-*-express-portal-converterexpress1-9251.vercel.app", "https://converter-*-express-portal-converterexpress1-9251.vercel.app/**"]
minimum_password_length = 10

[auth.email]
enable_confirmations = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Branded templates enabled after custom SMTP setup.
[auth.email.template.confirmation]
subject = "Verify your Converter Express account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Converter Express password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "Your Converter Express invitation"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Sign in to Converter Express"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your Converter Express email change"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "Your Converter Express verification code"
content_path = "./supabase/templates/reauthentication.html"

[auth.email.notification.password_changed]
enabled = true
subject = "Your Converter Express password changed"
content_path = "./supabase/templates/password_changed.html"

[auth.email.notification.email_changed]
enabled = true
subject = "Your Converter Express email changed"
content_path = "./supabase/templates/email_changed.html"
